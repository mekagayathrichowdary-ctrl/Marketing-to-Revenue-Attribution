:root[data-theme="dark"]{--bg:#0e1020;--card:#171a33;--ink:#e9ebfa;--mute:#9499bd;--line:#2a2e55;--side:#0a0b18;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "DM Sans",system-ui,sans-serif}

aside h1{font-size:16px;color:#fff;margin:0 8px 2px}aside p{font-size:11px;margin:0 8px 18px;color:#8a90c0}

</style></head><body><div class="app"><aside><h1>Revenue Intelligence</h1><p>Campaign → lead → revenue</p><div id="nav"></div></aside><main id="app"></main></div>
<script>
const ST=['Impressions','Clicks','Leads','MQL','SQL','Opportunity','Won'],BR=[.6,.35,.65,.55],REVN=['Social','Search','SEO','Email','Webinars','Referral'];
const CH=[['Paid Social',9120,[.35,.15,.5,.3],140,2.1,.011,.03,'#d6336c'],['Paid Search',6240,[.55,.17,.6,.5],160,3,.04,.06,'#0e9fb5'],['Organic SEO',3360,[.6,.2,.65,.55],40,3.4,.03,.05,'#2f9e63'],['Email',2400,[.5,.18,.6,.55],20,2.8,.12,.04,'#e8a317'],['Webinars',1680,[.7,.35,.7,.55],60,4,.2,.15,'#6c5ce7'],['Referral',1200,[.8,.4,.75,.5],30,4.4,.3,.25,'#ff7f50']].map(([n,l,r,sp,dv,ctr,cvr,c],i)=>{const st=[l/(ctr*cvr),l/cvr,l];r.forEach(x=>st.push(st[st.length-1]*x));const won=st[6];return{i,n,l,r,sp,dv,c,st,won,rev:won*dv,cac:sp/won,roas:won*dv/sp,l2w:r.reduce((a,b)=>a*b,1)}});
const sum=a=>a.reduce((x,y)=>x+y,0),TL=sum(CH.map(c=>c.l)),TR=sum(CH.map(c=>c.rev)),TS=sum(CH.map(c=>c.sp)),TW=sum(CH.map(c=>c.won));
const fL=x=>Math.abs(x)>=100?`₹${(x/100).toFixed(2)} Cr`:`₹${x.toFixed(1)} L`,fN=x=>x>=1e6?(x/1e6).toFixed(1)+'M':x>=1e3?(x/1e3).toFixed(1)+'K':Math.round(x),pc=(x,d=1)=>(x*100).toFixed(d)+'%';
const leaks=[];CH.forEach(c=>[0,1,2,3].forEach(k=>{if(c.r[k]<BR[k]){const dn=c.r.slice(k+1).reduce((a,b)=>a*b,1);leaks.push({c,k,stage:['Lead→MQL','MQL→SQL','SQL→Opp','Opp→Won'][k],act:c.r[k],bn:BR[k],lost:(BR[k]-c.r[k])*c.st[2+k]*dn*c.dv})}}));leaks.sort((a,b)=>b.lost-a.lost);const LK=sum(leaks.map(x=>x.lost));
const PATHS=[[.22,[[0,0],[1,6],[3,12]]],[.12,[[0,0],[4,9],[1,15]]],[.16,[[2,0],[3,5],[1,11]]],[.12,[[4,0],[3,7],[1,13]]],[.12,[[5,0],[1,8]]],[.1,[[1,0]]],[.06,[[5,0]]],[.1,[[2,0],[0,6],[1,14]]]];
const MODELS=['First touch','Last touch','Linear','Time decay','Position'],MC=['#d6336c','#0e9fb5','#2f9e63','#e8a317','#6c5ce7'];
function wts(m,t){const n=t.length;if(n==1)return[1];if(m==0)return t.map((_,i)=>+(i==0));if(m==1)return t.map((_,i)=>+(i==n-1));if(m==2)return t.map(()=>1/n);if(m==3){const T=t[n-1][1],w=t.map(x=>Math.pow(2,-(T-x[1])/7)),s=sum(w);return w.map(x=>x/s)}return n==2?[.5,.5]:t.map((_,i)=>i==0||i==n-1?.4:.2/(n-2))}
const credit=m=>{const o=Array(6).fill(0);PATHS.forEach(([w,t])=>{const ws=wts(m,t);t.forEach((x,i)=>o[x[0]]+=TR*w*ws[i])});return o},CR=MODELS.map((_,m)=>credit(m)),spread=i=>{const v=CR.map(r=>r[i]),mean=sum(v)/5;return(Math.max(...v)-Math.min(...v))/mean};
const HB=['<1h','1–4h','4–24h','24–48h','>48h'],HS=[.08,.14,.3,.28,.2],HR=[.42,.36,.26,.14,.08],MQ=sum(CH.map(c=>c.st[3])),SQ=sum(CH.map(c=>c.st[4])),S2W=TW/SQ,hr0=sum(HS.map((s,i)=>s*HR[i])),hr1=HS[0]*HR[0]+HS[1]*HR[1]+(1-HS[0]-HS[1])*HR[2],recov=MQ*(hr1-hr0)*S2W*(TR/TW)*.6;
const mw=Array.from({length:12},(_,m)=>1+.08*m),mv=Array.from({length:12},(_,m)=>(1+.012*m)*(1+.1*Math.sin(m/1.8))),LI=mw.map(x=>100*x/mw[0]),RI=mv.map(x=>100*x/mv[0]),MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const score=c=>Math.round(100*(.35*Math.min(c.roas/12,1)+.3*Math.min(c.l2w/.1,1)+.2*(1-Math.min(c.cac/2.5,1))+.15*Math.min(c.dv*1.5/c.cac/15,1)));
const proj=b=>{let rev=0,sp=0,ld=0,wn=0;CH.forEach((c,i)=>{const r=1+b[i]/100,k=Math.pow(r,.7);rev+=c.rev*k;sp+=c.sp*r;ld+=c.l*k;wn+=c.won*k});return{rev,sp,ld,wn,roas:rev/sp,cac:sp/wn}};
function optimal(){const x=CH.map(c=>c.sp),mg=i=>.7*CH[i].rev/CH[i].sp*Math.pow(x[i]/CH[i].sp,-.3);for(let n=0;n<900;n++){let lo=-1,hi=-1;CH.forEach((c,i)=>{if(x[i]>c.sp*.7+.01&&(lo<0||mg(i)<mg(lo)))lo=i;if(x[i]<c.sp*1.3-.01&&(hi<0||mg(i)>mg(hi)))hi=i});if(lo<0||hi<0||mg(hi)<=mg(lo))break;x[lo]-=.5;x[hi]+=.5}return x.map((v,i)=>Math.round((v/CH[i].sp-1)*100))}
let tab='Overview',fch=-1,model=1,pth=0,bud=Array(6).fill(0),hist=[];
const nt=(h,s)=>`<div class="nt"><span class="tg">How to read</span>${h}</div>`+(s?`<div class="nt"><span class="tg b">So what</span>${s}</div>`:''),inf=t=>`<span class="i" title="${t}">i</span>`,lgd=a=>`<div class="lg">${a.map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>`;
function bars(lab,ser,col,h=240,fmt=x=>x.toFixed(0)){const w=640,pl=36,pb=28,pt=8,mx=Math.max(...ser.flat(),1)*1.12,gw=(w-pl)/lab.length,bw=Math.min(26,(gw-8)/ser.length);let g='';for(let i=0;i<=4;i++){const y=pt+(h-pt-pb)*(1-i/4);g+=`<line x1="${pl}" x2="${w}" y1="${y}" y2="${y}" class="gl"/><text x="${pl-5}" y="${y+3}" class="ax" text-anchor="end">${fmt(mx*i/4)}</text>`}
lab.forEach((l,i)=>{ser.forEach((s,k)=>{const bh=(h-pt-pb)*s[i]/mx;g+=`<rect x="${pl+gw*i+(gw-bw*ser.length)/2+k*bw}" y="${h-pb-bh}" width="${bw-1.5}" height="${bh}" rx="3" fill="${Array.isArray(col[k])?col[k][i]:col[k]}"><title>${l}: ${fmt(s[i])}</title></rect>`});g+=`<text x="${pl+gw*i+gw/2}" y="${h-10}" class="ax" text-anchor="middle">${l}</text>`});return`<svg viewBox="0 0 ${w} ${h}">${g}</svg>`}
function line(lab,ser,h=240){const w=640,pl=36,pb=28,pt=8,mn=Math.min(...ser.flatMap(s=>s.v))*.9,mx=Math.max(...ser.flatMap(s=>s.v))*1.05,x=i=>pl+(w-pl-12)*i/(lab.length-1),y=v=>pt+(h-pt-pb)*(1-(v-mn)/(mx-mn));let g='';for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,yy=y(v);g+=`<line x1="${pl}" x2="${w}" y1="${yy}" y2="${yy}" class="gl"/><text x="${pl-5}" y="${yy+3}" class="ax" text-anchor="end">${v.toFixed(0)}</text>`}
lab.forEach((l,i)=>g+=`<text x="${x(i)}" y="${h-10}" class="ax" text-anchor="middle">${l}</text>`);ser.forEach(s=>g+=`<polyline fill="none" stroke="${s.c}" stroke-width="3" points="${s.v.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`+s.v.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${s.c}"><title>${lab[i]}: ${v.toFixed(0)}</title></circle>`).join(''));return`<svg viewBox="0 0 ${w} ${h}">${g}</svg>`}
const sel=`<select id="fc"><option value="-1">All channels</option>${CH.map(c=>`<option value="${c.i}">${c.n}</option>`).join('')}</select>`;
const V={
Overview(){const t=leaks[0];return`<h2>Executive overview</h2><p class="lead">Why does lead volume keep rising while revenue barely moves?</p>
<div class="grid k"><div class="card kpi"><b>${fN(TL)}</b><span>Leads (12 mo) ${inf('Everyone who filled a form or asked for a demo.')}</span></div><div class="card kpi g"><b>${fL(TR)}</b><span>Revenue from won deals ${inf('Won deals × average deal value per channel.')}</span></div><div class="card kpi a"><b>${pc(TW/TL)}</b><span>Lead → won rate ${inf('Share of leads that ended up paying.')}</span></div><div class="card kpi"><b>${fL(TS/TW)}</b><span>Blended CAC ${inf('Total spend ÷ customers won.')}</span></div><div class="card kpi a"><b>${(TR/TS).toFixed(1)}×</b><span>Blended ROAS ${inf('Revenue earned per ₹1 of marketing spend.')}</span></div><div class="card kpi r"><b>${fL(LK)}</b><span>Value leaked ${inf('Upper-bound estimate: revenue lost where a stage converts below target. Leaks overlap, so do not add them to revenue.')}</span></div></div>
<div class="grid c2" style="margin-top:14px"><div class="card"><h3>Leads vs revenue growth (Jan = 100)</h3>${line(MON,[{v:LI,c:'#d6336c'},{v:RI,c:'#2f9e63'}])}${lgd([['#d6336c','Lead volume'],['#2f9e63','Revenue']])}${nt('Both lines start at 100. A widening gap means leads grow faster than revenue.',`Leads are up ${(LI[11]-100).toFixed(0)}% but revenue only ${(RI[11]-100).toFixed(0)}%. Extra leads are not turning into customers.`)}</div>
<div class="card"><h3>Top 5 leaks by ₹ lost</h3>${leaks.slice(0,5).map(l=>`<div class="fb"><span class="n" style="width:130px"><b>${l.c.n}</b><br>${l.stage}</span><div class="t"><i style="width:${l.lost/t.lost*100}%;background:${l.c.c}"></i></div><span class="v" style="width:70px">${fL(l.lost)}</span></div>`).join('')}${nt('Each bar is revenue lost because a channel converts below the target rate at one stage.',`Biggest single leak: <b>${t.c.n}, ${t.stage}</b> (${pc(t.act,0)} vs ${pc(t.bn,0)} target).`)}</div></div>
<div class="card"><h3>Lead share vs revenue share</h3>${bars(REVN,[CH.map(c=>c.l/TL*100),CH.map(c=>c.rev/TR*100)],['#d6336c','#2f9e63'],220,x=>x.toFixed(0)+'%')}${lgd([['#d6336c','Share of leads'],['#2f9e63','Share of revenue']])}${nt('If the pink bar is taller than the green bar, the channel brings volume but not value.',`Paid Social brings ${pc(CH[0].l/TL,0)} of leads but only ${pc(CH[0].rev/TR,0)} of revenue.`)}</div>`},
Funnel(){const cs=fch<0?CH:[CH[fch]],st=ST.map((_,k)=>sum(cs.map(c=>c.st[k]))),lk=leaks.filter(l=>fch<0||l.c.i==fch);
return`<h2>Funnel explorer</h2><p class="lead">Follow the journey from exposure to revenue and see where it narrows.</p><div class="row">${sel}</div><div class="card"><h3>${fch<0?'All channels':CH[fch].n}</h3>${st.map((v,k)=>{const cv=k?v/st[k-1]:1,b=k>=3?BR[k-3]:null,lost=lk.filter(l=>l.k==k-2||(k==3&&false)),ls=sum(lk.filter(l=>l.k==k-3).map(l=>l.lost));return`<div class="fb"><span class="n">${ST[k]}</span><div class="t"><i style="width:${Math.max(v/st[0]*100,1.5)}%;background:${cv<(b||0)?'#d6336c':'#0e9fb5'}"></i></div><span class="v"><b>${fN(v)}</b> ${k?`· ${pc(cv)} ${b&&cv<b?`<span class="pill p-r">target ${pc(b,0)}</span>`:''}${ls>0?`<br>leak ${fL(ls)}`:''}`:''}</span></div>`}).join('')}
${nt('Bar length is volume (log-free, so late stages look tiny). Percent is conversion from the previous stage. Red bars convert below the target.',`Weakest stage vs target: <b>${(()=>{const q=lk.length?lk.reduce((a,b)=>a.lost>b.lost?a:b):null;return q?q.stage+(fch<0?' ('+q.c.n+')':''):'none'})()}</b>.`)}</div>
<div class="card"><h3>Stage conversion by channel vs target</h3><div class="tw"><table><tr><th>Channel</th><th>Lead→MQL</th><th>MQL→SQL</th><th>SQL→Opp</th><th>Opp→Won</th><th>Lead→Won</th></tr>${CH.map(c=>`<tr><td>${c.n}</td>${c.r.map((r,k)=>`<td><span class="pill ${r<BR[k]*.6?'p-r':r<BR[k]?'p-a':'p-g'}">${pc(r,0)}</span></td>`).join('')}<td><b>${pc(c.l2w)}</b></td></tr>`).join('')}<tr><td><i>Target</i></td>${BR.map(b=>`<td>${pc(b,0)}</td>`).join('')}<td></td></tr></table></div>${nt('Green meets target, amber is below it, red is under 60% of it.','MQL→SQL is below target almost everywhere, which points to a sales handoff problem, not only a channel problem.')}</div>`},
Attribution(){const cr=CR[model],T=PATHS[pth][1];return`<h2>Attribution lab</h2><p class="lead">Who really gets credit for the revenue? It depends on the rules you use.</p>
<div class="card"><div class="row">${MODELS.map((m,i)=>`<button class="btn ${i==model?'on':''}" data-m="${i}">${m}</button>`).join('')}</div><h3>Revenue credit by channel: ${MODELS[model]}</h3>${bars(REVN,[cr],[CH.map(c=>c.c)],220,x=>fL(x))}
${nt(['First touch gives all credit to the first interaction.','Last touch gives all credit to the final interaction before purchase.','Linear splits credit equally across touches.','Time decay gives more credit to recent touches (7-day half-life).','Position gives 40% to first, 40% to last and 20% to the middle.'][model],`Switching model moves credit between channels but the total stays ${fL(TR)}.`)}</div>
<div class="card"><h3>Do the models disagree?</h3>${bars(REVN,CR,MC,240,x=>fL(x))}${lgd(MODELS.map((m,i)=>[MC[i],m]))}<div class="tw"><table><tr><th>Channel</th>${MODELS.map(m=>`<th>${m}</th>`).join('')}<th>Spread</th></tr>${CH.map((c,i)=>`<tr><td>${c.n}</td>${CR.map(r=>`<td>${fL(r[i])}</td>`).join('')}<td><span class="pill ${spread(i)>.3?'p-r':'p-g'}">${spread(i)>.3?'misattributed ':''}${pc(spread(i),0)}</span></td></tr>`).join('')}</table></div>${nt('Spread = (highest − lowest credit) ÷ average across the 5 models. Above 30% means the channel’s value depends heavily on the rule.',`Paid Search earns ${fL(CR[1][1])} under last touch but ${fL(CR[0][1])} under first touch; Paid Social is the reverse (${fL(CR[1][0])} vs ${fL(CR[0][0])}).`)}</div>
<div class="card"><h3>Sample customer journey</h3><div class="row">${PATHS.map((p,i)=>`<button class="btn ${i==pth?'on':''}" data-p="${i}">Path ${i+1}</button>`).join('')}</div><div class="tl">${T.map(([c,d],i)=>`<div style="border-color:${CH[c].c}"><b>${CH[c].n}</b><br>Day ${d}<br>${MODELS.map((m,k)=>`${m.split(' ')[0]}: ${pc(wts(k,T)[i],0)}`).join('<br>')}</div>`).join('')}</div>${nt('Each column is one touchpoint on the way to a won deal, with the share of credit each model would give it.',`${pc(PATHS[pth][0],0)} of won deals follow this path.`)}</div>`},
Channels(){const bc=[...CH].sort((a,b)=>score(b)-score(a));const w=640,h=300,x=v=>50+v*(w-70)/45,y=v=>h-40-v*(h-60)/50;let g=`<line x1="${x(0)}" y1="${y(0)}" x2="${x(45)}" y2="${y(45)}" stroke="var(--mute)" stroke-dasharray="5 4"/><text x="${x(30)}" y="${y(36)}" class="ax">parity line</text><text x="${w/2}" y="${h-6}" class="ax" text-anchor="middle">Share of leads (%)</text><text x="10" y="20" class="ax">Revenue share (%)</text>`;
CH.forEach(c=>g+=`<circle cx="${x(c.l/TL*100)}" cy="${y(c.rev/TR*100)}" r="${8+c.sp/TS*50}" fill="${c.c}" fill-opacity=".75"><title>${c.n}: ${pc(c.l/TL,0)} leads, ${pc(c.rev/TR,0)} revenue, ${fL(c.sp)} spend</title></circle><text x="${x(c.l/TL*100)+12+c.sp/TS*50}" y="${y(c.rev/TR*100)+4}" class="ax">${c.n}</text>`);
return`<h2>Channel & campaign quality</h2><p class="lead">Cheap leads are not the same as valuable customers.</p><div class="card"><h3>Lead share vs revenue share (bubble = spend)</h3><svg viewBox="0 0 ${w} ${h}">${g}</svg>${nt('Below the dashed line, a channel earns less revenue than its share of leads. Above it, it over-delivers.',`Social sits far below the line; Referral, Webinars and SEO sit above it.`)}</div>
<div class="card"><h3>Scorecard ${inf('Score 0–100 = 35% ROAS + 30% lead→won + 20% CAC (lower is better) + 15% LTV:CAC. LTV assumes 1.5× the first deal.')}</h3><div class="tw"><table><tr><th>Channel</th><th>Spend</th><th>CPL</th><th>CAC</th><th>ROAS</th><th>Lead→Won</th><th>LTV:CAC</th><th>Score</th></tr>${bc.map(c=>`<tr><td><b>${c.n}</b></td><td>${fL(c.sp)}</td><td>₹${(c.sp*1e5/c.l).toFixed(0)}</td><td>${fL(c.cac)}</td><td>${c.roas.toFixed(1)}×</td><td>${pc(c.l2w)}</td><td>${(c.dv*1.5/c.cac).toFixed(1)}×</td><td><span class="pill ${score(c)>65?'p-g':score(c)>40?'p-a':'p-r'}">${score(c)}</span></td></tr>`).join('')}</table></div>${nt('CPL is cost per lead, CAC is cost per paying customer, ROAS is revenue per ₹1 spent.',`Social’s CPL is the lowest, yet its CAC is ${(CH[0].cac/CH[5].cac).toFixed(0)}× Referral’s. That is why it looks efficient but is not.`)}</div>`},
Handoff(){return`<h2>Handoff diagnostics</h2><p class="lead">Marketing hands over a lead. How fast does sales act, and what does it cost?</p><div class="grid c2"><div class="card"><h3>MQL → SQL conversion by response time</h3>${bars(HB,[HR.map(x=>x*100)],['#0e9fb5'],230,x=>x.toFixed(0)+'%')}${nt('Each bar is the share of qualified leads that sales accepts, grouped by how long sales took to first respond.',`Conversion drops from ${pc(HR[0],0)} within 1 hour to ${pc(HR[4],0)} after 48 hours.`)}</div>
<div class="card"><h3>How leads are distributed</h3>${bars(HB,[HS.map(x=>x*100)],['#d6336c'],230,x=>x.toFixed(0)+'%')}${nt('Share of all leads by first-response time.',`${pc(HS[3]+HS[4],0)} of leads wait more than 24 hours.`)}</div></div>
<div class="grid k"><div class="card kpi r"><b>${pc(hr0)}</b><span>Today’s MQL→SQL (target 35%)</span></div><div class="card kpi g"><b>${pc(hr1)}</b><span>If all responses are within 24h</span></div><div class="card kpi a"><b>${fL(recov)}</b><span>Recoverable revenue ${inf('Extra SQLs × SQL→won rate × avg deal value, discounted 40% for realism.')}</span></div></div>`},
Agent(){return`<h2>AI analyst agent</h2><p class="lead">Ask a question. The agent shows which analysis it ran, then answers from the data.</p><div class="card"><div id="chat"></div><div class="row" style="margin-top:10px">${['Where are we losing the most value?','Which channel looks good but isn’t?','Why is revenue not growing with leads?','Should we cut Paid Social?','Why is follow-up speed a problem?','Run the optimal budget plan'].map(q=>`<button class="chip" data-q="${q}">${q}</button>`).join('')}</div><form class="ask" onsubmit="return false"><input id="q" placeholder="Ask anything about the funnel…"><button class="btn p" id="go">Ask</button></form></div>${nt('The agent routes your question to funnel, leakage, attribution, handoff or optimizer calculations, so every number comes from the dashboard data.')}`},
Optimizer(){const p=proj(bud),b=proj(Array(6).fill(0));return`<h2>Budget optimizer</h2><p class="lead">Move budget between channels and see the projected outcome.</p><div class="grid c2"><div class="card"><h3>Budget change per channel ${inf('Revenue = a × spend^0.7, so each extra rupee earns a little less (diminishing returns). Limit ±30%.')}</h3>${CH.map((c,i)=>`<div class="sl"><span style="color:${c.c};font-weight:700">${c.n.replace('Paid ','')}</span><input type="range" min="-30" max="30" value="${bud[i]}" data-b="${i}"><b>${bud[i]>0?'+':''}${bud[i]}%</b></div>`).join('')}<div class="row" style="margin-top:12px"><button class="btn p" id="opt">Apply optimal plan</button><button class="btn" id="rst">Reset</button></div>${nt('Drag a slider to raise or cut a channel’s budget. The agent’s optimal plan moves money to the highest marginal return.')}</div>
<div class="card"><h3>Projected outcome</h3><div class="tw"><table><tr><th></th><th>Now</th><th>Projected</th><th>Change</th></tr>${[['Spend',b.sp,p.sp,fL],['Revenue',b.rev,p.rev,fL],['Leads',b.ld,p.ld,fN],['Customers',b.wn,p.wn,x=>Math.round(x)],['ROAS',b.roas,p.roas,x=>x.toFixed(2)+'×'],['CAC',b.cac,p.cac,fL]].map(([n,a,c,f])=>`<tr><td>${n}</td><td>${f(a)}</td><td><b>${f(c)}</b></td><td><span class="pill ${(c-a)*(n=='CAC'?-1:1)>=0?'p-g':'p-r'}">${((c/a-1)*100).toFixed(1)}%</span></td></tr>`).join('')}</table></div>${nt('Compares today’s plan with your slider settings.',p.rev>b.rev?`Revenue up ${fL(p.rev-b.rev)} with ${p.sp<=b.sp+.5?'no extra spend':fL(p.sp-b.sp)+' extra spend'}.`:'Adjust sliders or apply the optimal plan.')}</div></div>`}};
const TABS=['Overview','Funnel','Attribution','Channels','Handoff','Agent','Optimizer'];
function draw(){document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${t==tab?'on':''}" data-t="${t}">${t}</button>`).join('');app.innerHTML=V[tab]();if(tab=='Agent'){hist.forEach(h=>add(h[0],h[1],1));if(!hist.length)add('a','Hello. I trace campaigns to revenue and find where value leaks. Pick a question below or type your own.')}}
const app=document.getElementById('app');
function add(c,h,q){const d=document.createElement('div');d.className='m '+c;d.innerHTML=h;const ch=document.getElementById('chat');ch.appendChild(d);ch.scrollTop=1e9;if(!q)hist.push([c,h])}
function think(steps,out){const b=document.createElement('div');b.className='m a';const ch=document.getElementById('chat');ch.appendChild(b);let i=0;(function n(){if(i<steps.length){b.innerHTML+=`<div class="st">${steps[i++]}</div>`;ch.scrollTop=1e9;setTimeout(n,400)}else{b.remove();add('a',steps.map(s=>`<div class="st">${s}</div>`).join('')+'<hr style="border:0;border-top:1px solid var(--line)">'+out)}})()}
const li=a=>a.map(x=>'• '+x).join('<br>');
function ask(t){add('u',t);const l=t.toLowerCase(),sc=CH[0];
if(/optimal|plan|budget/.test(l)){bud=optimal();const p=proj(bud),b=proj(Array(6).fill(0));return think(['optimizer.init(spend, ±30% cap)','marginal_roi(channel) = 0.7 × rev ÷ spend × (x/base)^-0.3','greedy_shift(lowest → highest marginal ROI)','project(revenue, CAC, ROAS)'],`Optimal plan:<br>${li(CH.map((c,i)=>`${c.n}: <b>${bud[i]>0?'+':''}${bud[i]}%</b>`))}<br>Revenue ${fL(b.rev)} → <b>${fL(p.rev)}</b> (+${fL(p.rev-b.rev)}) at the same spend. <button class="chip" data-t="Optimizer">Open optimizer</button>`)}
if(/cut|social/.test(l))return think(['funnel_query(channel=Paid Social)','roas(channel) vs blended','attribution_compare(first vs last touch)','recommend()'],`Paid Social returns <b>${sc.roas.toFixed(1)}×</b> ROAS vs ${(TR/TS).toFixed(1)}× blended and wins only ${pc(sc.l2w)} of leads. But it earns <b>${fL(CR[0][0])}</b> under first-touch credit versus ${fL(CR[1][0])} under last-touch, so it starts many journeys.<br><b>Recommendation:</b> cut ~30% of spend rather than all of it, tighten lead qualification, and move budget to Referral and Webinars.`);
if(/follow|handoff|speed|response|sales/.test(l))return think(['handoff_diagnostics(response_time_buckets)','winrate_by_bucket()','recoverable_revenue(<24h scenario)'],`${pc(HS[3]+HS[4],0)} of leads wait over 24 hours. MQL→SQL falls from ${pc(HR[0],0)} (under 1h) to ${pc(HR[4],0)} (over 48h). Responding to everyone within 24h lifts conversion from ${pc(hr0)} to ${pc(hr1)} and recovers about <b>${fL(recov)}</b>.`);
if(/good|isn.?t|vanity|misleading|looks/.test(l))return think(['lead_share vs revenue_share ratio','cac vs blended','attribution_spread()'],`Paid Social is the vanity channel: <b>${pc(sc.l/TL,0)}</b> of leads, <b>${pc(sc.rev/TR,0)}</b> of revenue, CAC ${fL(sc.cac)} vs ${fL(TS/TW)} blended. Paid Search also looks strong under last touch (${fL(CR[1][1])}) but only ${fL(CR[0][1])} under first touch, so part of its credit is borrowed from earlier channels.`);
if(/why|grow|not growing/.test(l))return think(['trend(leads, revenue)','mix_analysis()','stage_conversion_vs_target()','handoff_diagnostics()'],`Leads grew ${(LI[11]-100).toFixed(0)}% over the year, revenue only ${(RI[11]-100).toFixed(0)}%. Three causes:<br>${li([`<b>Mix:</b> ${pc(sum(CH.filter(c=>c.roas<2).map(c=>c.l))/TL,0)} of leads come from channels earning under 2× ROAS`,`<b>Handoff:</b> MQL→SQL is ${pc(hr0)} vs 35% target`,`<b>Attribution:</b> last-touch reporting hides the channels that start journeys`])}`);
if(/loss|losing|leak|value|critical|gap/.test(l))return think(['funnel_query(all)','leakage_calc(benchmark − actual)','rank(by ₹ lost)'],`Estimated total leakage <b>${fL(LK)}</b> (upper bound). Top leaks:<br>${li(leaks.slice(0,3).map(x=>`<b>${x.c.n} · ${x.stage}</b>: ${fL(x.lost)} (${pc(x.act,0)} vs ${pc(x.bn,0)} target)`))}`);
add('a','I can answer questions on value leakage, vanity channels, why revenue lags leads, cutting Paid Social, follow-up speed, or run the optimal budget plan.')}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;if(d.t){tab=d.t;draw()}else if(d.m){model=+d.m;draw()}else if(d.p){pth=+d.p;draw()}else if(d.q)ask(d.q);else if(t.id=='go'){const q=document.getElementById('q');if(q.value.trim()){ask(q.value);q.value=''}}else if(t.id=='opt'){bud=optimal();draw()}else if(t.id=='rst'){bud=Array(6).fill(0);draw()}});
document.addEventListener('input',e=>{if(e.target.dataset.b!=null){bud[+e.target.dataset.b]=+e.target.value;const y=scrollY;draw();scrollTo(0,y)}});
document.addEventListener('change',e=>{if(e.target.id=='fc'){fch=+e.target.value;draw();document.getElementById('fc').value=fch}});
document.addEventListener('submit',e=>e.preventDefault());draw();
</script></body></html>
